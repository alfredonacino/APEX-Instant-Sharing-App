# APEX Instant Sharing - HTTPS vhost.
#
# Apache terminates the public certificate and proxies to the application's own
# HTTPS listener on 3443. The backend keeps doing its own TLS, so the traffic is
# encrypted on both legs; the app's certificate is self-signed and only ever
# presented to Apache, which is why peer verification is off for the backend
# leg (and only for it - the public leg uses the real certificate below).
#
# Install: /etc/apache2/sites-available/instantsharing.supportlab.cloud-le-ssl.conf

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName instantsharing.supportlab.cloud
    ServerAdmin alfredo@nacino.net
    DocumentRoot /var/www/instantsharing.supportlab.cloud/html

    ErrorLog  /var/www/instantsharing.supportlab.cloud/log/error.log
    CustomLog /var/www/instantsharing.supportlab.cloud/log/access.log combined

    ProxyPreserveHost On
    ProxyRequests Off
    # Uploads are capped at 200 MB and hashed on arrival, so allow a slow client
    # to finish rather than cutting the request off mid-upload.
    ProxyTimeout 600
    AllowEncodedSlashes NoDecode

    SSLProxyEngine On
    SSLProxyCheckPeerName off
    SSLProxyCheckPeerCN off
    SSLProxyVerify None

    ProxyPass        / https://127.0.0.1:3443/
    ProxyPassReverse / https://127.0.0.1:3443/

    # The app marks its session cookie Secure and builds absolute links; without
    # these it would see plain HTTP and refuse to send the cookie.
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"

    # 200 MB uploads plus a margin. Must not be lower than MAX_UPLOAD_MB.
    LimitRequestBody 231735296

    SSLEngine on
    SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder     off

    # Same store the other sites on this server use. Point these at
    # /etc/letsencrypt/live/<name>/ instead once certbot has issued a real
    # certificate (see deploy/apache/README.md).
    SSLCertificateFile    /etc/ssl/apex-apache-manager/instantsharing.supportlab.cloud/fullchain.pem
    SSLCertificateKeyFile /etc/ssl/apex-apache-manager/instantsharing.supportlab.cloud/privkey.pem
</VirtualHost>
</IfModule>
