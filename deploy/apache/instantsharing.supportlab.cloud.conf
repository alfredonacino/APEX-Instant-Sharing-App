# APEX Instant Sharing - plain HTTP vhost.
#
# Two jobs only: serve the ACME challenge so certbot can issue and renew, and
# send everything else to HTTPS.
#
# Install: /etc/apache2/sites-available/instantsharing.supportlab.cloud.conf

<VirtualHost *:80>
    ServerName instantsharing.supportlab.cloud
    ServerAdmin alfredo@nacino.net
    DocumentRoot /var/www/instantsharing.supportlab.cloud/html

    ErrorLog  /var/www/instantsharing.supportlab.cloud/log/error.log
    CustomLog /var/www/instantsharing.supportlab.cloud/log/access.log combined

    # Shared ACME http-01 webroot, as used by the other sites on this server.
    Alias /.well-known/acme-challenge/ /var/www/letsencrypt/.well-known/acme-challenge/
    <Directory "/var/www/letsencrypt/.well-known/acme-challenge">
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    # Everything to HTTPS, except the challenge path - certbot must be able to
    # fetch that over plain HTTP at renewal time.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
